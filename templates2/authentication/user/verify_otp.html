<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify OTP - ePolice Seva</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #0a1f44;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .otp-box {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .otp-box h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #0a1f44;
            font-weight: 600;
        }

        .otp-box p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .form-label {
            font-weight: 500;
            color: #333;
        }

        .form-control {
            padding: 11px 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            text-align: center;
            font-size: 20px;
            letter-spacing: 5px;
        }

        .form-control:focus {
            border-color: #0a1f44;
            box-shadow: 0 0 0 0.2rem rgba(10, 31, 68, 0.15);
        }

        .btn-primary {
            width: 100%;
            padding: 11px;
            border-radius: 8px;
            background: #0a1f44;
            border: none;
            font-weight: 500;
        }

        .btn-primary:hover {
            background: #123568;
        }

        .alert {
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .back-login {
            text-align: center;
            margin-top: 18px;
        }

        .back-login a {
            color: #0a1f44;
            text-decoration: none;
            font-weight: 500;
        }

        .back-login a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="otp-box">

        <h2>🔐 Verify OTP</h2>

        <p>
            Enter the 6-digit OTP sent to your registered email.
        </p>

        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Enter OTP</label>

                <input type="text" name="otp" class="form-control" placeholder="000000" maxlength="6"
                    inputmode="numeric" pattern="[0-9]{6}" required>
            </div>

            <button type="submit" class="btn btn-primary">
                Verify OTP
            </button>
        </form>

        <div class="back-login">
            <a href="{% url 'user_login' %}">
                ← Back to Login
            </a>
        </div>

    </div>

</body>

</html>
