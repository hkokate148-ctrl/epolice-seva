<!DOCTYPE html>
<html>
<head>
    <title>Add Book</title>
</head>

<body>

<h1>Add Book</h1>

<form method="post">
    {% csrf_token %}

    <label>Book Name:</label><br>
    <input type="text" name="book_name" required><br><br>

    <label>Author:</label><br>
    <input type="text" name="author" required><br><br>

    <button type="submit">Save Book</button>
</form>

</body>
</html>
